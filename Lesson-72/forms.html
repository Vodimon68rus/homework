<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../Lesson-72/forms.html" />
  </head>
  <body>
    <form>
      <label for="name" class="label">Login</label>
      <input
        id="name"
        class="input"
        type="text"
        placeholder="Ваш никнейм"
        name="name"
        required
      />
      <label for="pass" class="label">Password</label>
      <input
        id="pass"
        class="input"
        type="password"
        placeholder="qwerty"
        name="password"
        required
      />
    </form>
  </body>
</html>
